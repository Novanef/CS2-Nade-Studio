<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CS2 Nade Studio — Overlay</title>
<style>
:root {
  --surface-2: #eeeeec;
  --border-strong: rgba(0,0,0,0.25);
  --text-accent: #2563eb;
  --text-secondary: #6b7280;
  --text-error: #dc2626;
}
html, body {
  overflow: hidden;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  background: var(--surface-2);
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.panel {
  border: 0.5px solid var(--border-strong);
  border-radius: 10px;
  padding: 10px 14px;
  box-sizing: border-box;
  height: 100vh;
  overflow: hidden;
}
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-accent); animation: pulse 1.6s ease-in-out infinite; flex: none; }
/* Le panneau est un petit rectangle opaque de taille fixe (voir CLAUDE.md) — le
   texte de statut doit rester sur une seule ligne (les messages Python sont tenus
   courts en conséquence) plutôt que de déborder verticalement et déclencher une
   scrollbar sur la fenêtre native. */
#statusText { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hotkeys { font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; white-space: nowrap; }
</style>
</head>
<body>
<div class="panel">
  <div class="row">
    <div id="dot"></div>
    <span id="statusText">Aucune capture en cours</span>
  </div>
  <div class="hotkeys">
    <span>F9 — capturer</span>
    <span>F6 — tester</span>
    <span>F7 — map</span>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
