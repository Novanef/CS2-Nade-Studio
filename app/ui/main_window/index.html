<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CS2 Nade Studio</title>
<!-- SlimSelect (vendored, voir vendor/) : remplace juste le rendu visuel de deux
     <select> natifs (type de grenade, type de clic) pour pouvoir mettre une icône
     dans chaque option — la balise <select> d'origine reste la source de vérité
     (valeur, comportement de formulaire), voir populateIconSelects() dans main.js. -->
<link rel="stylesheet" href="vendor/slimselect.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Vue "Bibliothèque" — adaptée de docs/maquette/1-app-principal.html, rendue data-driven.
     Le screenshot sert de fond plein écran (position:absolute, voir .media-stage dans
     .browse-hero) ; tout le reste (.browse-foreground) flotte par-dessus, en semi-transparent,
     ancré en haut (recherche/filtres) et en bas (détail + vignettes) avec un espace vide au
     milieu qui laisse voir la photo. -->
<section id="view-browse" class="panel browse-hero full-bleed">

  <div class="media-stage" id="browseMediaStage">
    <img class="stage-media hidden" id="detailScreenshotImg" alt="Screenshot du point de départ">
    <!-- Réticule de visée plutôt qu'un pictogramme "photo cassée" générique — cohérent
         avec le viseur magenta que l'app dessine elle-même sur les vraies captures
         (voir CLAUDE.md, _draw_crosshair). -->
    <svg class="stage-media" id="detailScreenshotFallback" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="0" width="200" height="160" fill="var(--surface-1)"/>
      <rect x="0" y="92" width="200" height="68" fill="var(--surface-0)"/>
      <circle cx="100" cy="78" r="22" fill="none" stroke="#e6007e" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
      <line x1="100" y1="48" x2="100" y2="64" stroke="#e6007e" stroke-width="2"/>
      <line x1="100" y1="92" x2="100" y2="108" stroke="#e6007e" stroke-width="2"/>
      <line x1="70" y1="78" x2="86" y2="78" stroke="#e6007e" stroke-width="2"/>
      <line x1="114" y1="78" x2="130" y2="78" stroke="#e6007e" stroke-width="2"/>
      <path d="M58 48 L58 38 L68 38" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
      <path d="M142 48 L142 38 L132 38" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
      <path d="M58 108 L58 118 L68 118" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
      <path d="M142 108 L142 118 L132 118" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
    </svg>
    <p class="stage-caption hidden" id="detailScreenshotCaption"></p>
  </div>

  <div class="media-stage hidden" id="instantMediaStage">
    <span class="stage-label hidden" id="instantShotLabel"></span>
    <img class="stage-media hidden" id="instantGroupShotImg" alt="Screenshot du spawn sélectionné">
    <div class="stage-empty hidden" id="instantGroupShotEmpty">Sélectionne un spawn ci-dessous.</div>
  </div>

  <div class="browse-layout">
  <div class="browse-foreground">
    <div class="toolbar">
      <button class="pill icon-btn" id="btnNewLineup" onclick="openCreateView()" title="Nouveau lineup" aria-label="Nouveau lineup"></button>
    </div>

    <!-- Titre (haut-gauche) + actions (haut-droite) : pastilles compactes plutôt
         qu'une grande barre pleine largeur, pour laisser voir la photo entre les deux. -->
    <div class="detail-pill-row">
      <div class="detail-bar" id="lineupDetail">
        <div style="min-width:0;">
          <p style="font-size:14px;font-weight:500;margin:0;" id="detailSpotName">—</p>
          <p style="font-size:12px;color:var(--text-secondary);margin:2px 0 0;" id="detailNotes"></p>
        </div>
        <span class="badge hidden" id="detailThrowLabel"></span>
      </div>

      <div class="detail-bar hidden" id="instantGroupBar">
        <div>
          <p style="font-size:14px;font-weight:500;margin:0;" id="instantGroupTitle">—</p>
          <p class="status-line" id="instantGroupSubtitle" style="margin:2px 0 0;"></p>
        </div>
        <span class="badge hidden" id="instantThrowLabel"></span>
        <span class="badge">Instant</span>
        <button class="pill icon-btn" id="btnDeleteInstantGroup" onclick="deleteInstantGroup()" title="Supprimer le groupe" aria-label="Supprimer le groupe"></button>
      </div>

      <div class="detail-bar" id="detailActions" style="gap:8px;">
        <button class="pill icon-btn" id="btnToggleFavorite" onclick="toggleFavorite()" title="Favori" aria-label="Marquer comme favori"></button>
        <button class="pill icon-btn" id="btnEditLineup" onclick="openEditLineupView()" title="Éditer" aria-label="Éditer"></button>
        <button class="pill icon-btn" id="btnDeleteLineup" onclick="deleteLineup()" title="Supprimer" aria-label="Supprimer"></button>
        <button class="pill icon-btn hidden" id="btnOpenSpawnLineup" onclick="openSelectedSpawnLineup()" title="Éditer ce lineup" aria-label="Éditer ce lineup"></button>
        <button class="pill icon-btn hidden" id="btnDeleteSpawnLineup" onclick="deleteSpawnLineup()" title="Supprimer ce lineup" aria-label="Supprimer ce lineup"></button>
      </div>
    </div>

    <!-- Zone vide qui laisse voir la photo — les incrustations radar/zoom sont
         ancrées à SES coins bas (position:relative ici), pas à ceux de toute la
         fenêtre : elles ne peuvent donc jamais chevaucher le bandeau du bas
         ("Autres lineups"), qui est un frère en flux normal après cette zone. -->
    <div class="browse-spacer">
      <div class="inset-panel inset-radar hidden" id="radarInset">
        <div class="radar-wrap" id="radarWrap" onclick="openRadarFullscreen()" style="cursor:pointer;" title="Voir tous les lineups sur le radar">
          <img class="radar-img" id="radarImg" alt="Radar de la carte">
          <div class="radar-marker hidden" id="radarMarker"></div>
        </div>
      </div>
      <div class="inset-panel inset-zoom hidden" id="zoomInset">
        <img id="detailZoomImg" alt="Zoom autour du viseur">
      </div>
      <div class="inset-panel inset-radar hidden" id="instantGroupRadarInset">
        <div class="radar-wrap" id="instantGroupRadarWrap">
          <img class="radar-img" id="instantGroupRadarImg" alt="Radar de la carte">
        </div>
      </div>
      <div class="inset-panel inset-zoom hidden" id="instantGroupZoomInset">
        <img id="instantGroupZoomImg" alt="Zoom du spawn sélectionné">
      </div>
    </div>

  </div>

  <!-- Panneau de filtres — partagé avec le radar plein écran : main.js le déplace
       (appendChild) dans .radar-fullscreen-layout à l'ouverture de cette vue, et le
       ramène ici à la fermeture (openRadarFullscreen/closeRadarFullscreen). Reste un
       simple frère flex ("push", pas overlay) dans la vue où il se trouve à l'instant. -->
  <div id="lineupPanelWrap" class="side-panel-wrap open">
    <button class="pill icon-btn" id="btnToggleLineupPanel" onclick="toggleLineupPanel()" title="Filtres &amp; lineups" aria-label="Filtres &amp; lineups"></button>
    <aside id="lineupPanel" class="side-panel">
      <div class="side-panel-inner">
        <div class="side-panel-filters">
          <select id="mapSelect"></select>
          <span class="server-map-badge hidden" id="serverMapBadge"></span>
          <div style="display:flex;gap:4px;">
            <button class="pill icon-btn side-ct" id="side-CT" onclick="toggleSide('CT')" title="Camp CT" aria-label="Camp CT"></button>
            <button class="pill icon-btn side-t" id="side-T" onclick="toggleSide('T')" title="Camp T" aria-label="Camp T"></button>
          </div>
          <input type="text" id="searchInput" placeholder="Rechercher un spot, ex: Palace smoke" oninput="onSearchInput()">
          <div class="pill-row" id="categoryPills"></div>
          <button class="pill" id="instantOnlyToggle" onclick="toggleInstantOnlyFilter()">Instant uniquement</button>
          <div class="pill-row">
            <button class="pill icon-btn" id="btnSelectionMode" onclick="toggleSelectionMode()" title="Sélection multiple" aria-label="Sélection multiple"></button>
            <button class="pill icon-btn hidden" id="btnExportSelection" onclick="exportSelection()" title="Exporter la sélection" aria-label="Exporter la sélection"><span class="count-badge" id="exportSelectionCount"></span></button>
            <button class="pill icon-btn hidden" id="btnDeleteSelection" onclick="deleteSelection()" title="Supprimer la sélection" aria-label="Supprimer la sélection"><span class="count-badge" id="deleteSelectionCount"></span></button>
            <button class="pill icon-btn" id="btnExportLibrary" onclick="exportLibrary()" title="Exporter toute la bibliothèque" aria-label="Exporter toute la bibliothèque"></button>
            <button class="pill icon-btn" id="btnImportLineups" onclick="importLineups()" title="Importer des lineups" aria-label="Importer des lineups"></button>
            <button class="pill icon-btn danger" id="btnDeleteLibrary" onclick="deleteLibrary()" title="Supprimer toute la bibliothèque" aria-label="Supprimer toute la bibliothèque"></button>
          </div>
        </div>

        <p class="card-label" id="stripLabel">Autres lineups</p>
        <div class="strip" id="lineupStrip"></div>
      </div>
    </aside>
  </div>

  </div>

</section>

<!-- Vue "Radar plein écran" : toutes les positions de lineups standards (filtrées)
     d'un coup, une icône par type de grenade plutôt qu'un point unique. Les lineups
     instant n'y apparaissent pas — ils ont leur propre flux dédié (voir
     renderInstantGroupView dans main.js). Bouton retour + titre en overlay flottant
     plutôt qu'en toolbar de flux, pour laisser le radar occuper le reste de l'espace. -->
<section id="view-radar-fullscreen" class="panel hidden full-bleed">
  <div class="radar-fullscreen-topbar">
    <button class="pill icon-btn" id="btnCloseRadarFullscreen" onclick="closeRadarFullscreen()" title="Retour" aria-label="Retour"></button>
    <p style="font-size:15px;font-weight:500;margin:0;" id="radarFullscreenTitle"></p>
  </div>
  <!-- Le panneau de filtres est déplacé ici (second enfant flex) par
       openRadarFullscreen() quand cette vue s'ouvre — voir main.js. -->
  <div class="radar-fullscreen-layout">
    <div class="radar-slot">
      <div class="radar-wrap" id="radarFullscreenWrap">
        <img class="radar-img" id="radarFullscreenImg" alt="Radar de la carte">
      </div>
    </div>
  </div>
  <p class="status-line hidden" id="radarFullscreenEmpty" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;">Pas de calibration radar pour cette carte.</p>
</section>

<!-- Vue "Nouveau lineup" : formulaire + capture plugin + saisie manuelle -->
<section id="view-create" class="panel hidden">
  <div class="toolbar">
    <p style="font-size:15px;font-weight:500;margin:0;" id="createViewTitle">Nouveau lineup</p>
    <button class="pill icon-btn" id="btnCancelCreate" style="margin-left:auto;" onclick="closeCreateView()" title="Annuler" aria-label="Annuler"></button>
  </div>

  <div class="field-row">
    <div class="form-row">
      <label>Carte</label>
      <select id="form-mapId"></select>
    </div>
    <div class="form-row">
      <label>Camp</label>
      <div style="display:flex;gap:4px;">
        <input type="hidden" id="form-side" value="CT">
        <button type="button" class="pill icon-btn side-ct" id="form-side-CT" onclick="selectFormSide('CT')" title="Camp CT" aria-label="Camp CT"></button>
        <button type="button" class="pill icon-btn side-t" id="form-side-T" onclick="selectFormSide('T')" title="Camp T" aria-label="Camp T"></button>
      </div>
    </div>
    <div class="form-row">
      <label>Type de grenade</label>
      <select id="form-grenadeType">
        <option value="smoke">Smoke</option>
        <option value="flash">Flash</option>
        <option value="molotov">Molotov</option>
        <option value="he">HE</option>
        <option value="decoy">Decoy</option>
      </select>
    </div>
    <div class="form-row">
      <label>Déplacement au lancer</label>
      <select id="form-movement">
        <option value="stand">Stand</option>
        <option value="walk">Walk</option>
        <option value="run">Run</option>
        <option value="jump">Jump</option>
        <option value="wjump">W+Jump</option>
        <option value="walkrunjump">Walk+Run+Jump</option>
      </select>
    </div>
    <div class="form-row">
      <label>Accroupi</label>
      <input type="checkbox" id="form-crouch">
    </div>
    <div class="form-row">
      <label>Clic</label>
      <select id="form-clickType">
        <option value="left">Gauche</option>
        <option value="right">Droit</option>
        <option value="middle">Milieu</option>
      </select>
    </div>
    <div class="form-row">
      <label>Catégorie</label>
      <select id="form-category">
        <option value="standard">Standard</option>
        <option value="instant">Instant (spawn)</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <div class="form-row" style="flex:1;min-width:220px;">
      <label>Nom du spot</label>
      <input type="text" id="form-spotName" placeholder="ex: Palace smoke">
    </div>
  </div>
  <div class="form-row">
    <label>Notes</label>
    <input type="text" id="form-notes" placeholder="Instructions générales">
  </div>

  <!-- Capture via plugin -->
  <div class="card capture-card">
    <p class="card-label">Capture en jeu (plugin)</p>

    <div class="capture-media">
      <div class="hidden" id="instantSpawnPanel">
        <div class="radar-slot">
          <div class="radar-wrap" id="instantPickerWrap">
            <img class="radar-img" id="instantPickerImg" alt="Radar de la carte">
          </div>
        </div>
      </div>
      <img class="screenshot-preview hidden" id="captureScreenshotImg" alt="Screenshot capturé">
    </div>

    <div class="capture-footer">
      <div class="capture-footer-status">
        <p class="status-line" id="captureStatusLine">Vise puis F9 pour capturer, F10 pour tester.</p>
        <p class="status-line hidden" id="instantPickerStatusLine">Sélectionnez un spawn puis téléportez-vous.</p>
        <p class="status-line hidden" id="hudToggleStatusLine"></p>
      </div>
      <div class="actions-row">
        <div class="hidden" id="teleportActionsRow">
          <button class="pill icon-btn" id="btnTeleportSpawn" onclick="teleportToSelectedSpawn()" disabled title="Téléporter à ce spawn">Téléporter</button>
          <button class="pill icon-btn hidden" id="btnFixMapMismatch" title="Changer de map">Changer de map</button>
        </div>
        <button class="pill icon-btn" id="btnSaveCapture" onclick="saveCapture()" disabled title="Sauvegarder" aria-label="Sauvegarder"></button>
        <button class="pill icon-btn" id="btnToggleHud" onclick="toggleHud()" title="Masquer le HUD (test)" aria-label="Masquer le HUD (test)"></button>
      </div>
    </div>
  </div>

</section>

<script src="vendor/slimselect.js"></script>
<script src="logic.js"></script>
<script src="main.js"></script>
</body>
</html>
