<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CS2 Nade Studio — Panneau overlay</title>
<style>
:root {
  --surface-0: #ffffff;
  --surface-1: #f7f7f5;
  --surface-2: #eeeeec;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.25);
  --border-accent: #93c5fd;
  --bg-accent: #eff6ff;
  --text-accent: #2563eb;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --radius: 8px;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--surface-0); color: #111827; margin: 0; padding: 24px; }
button, input, select { font-family: inherit; font-size: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 10px; background: var(--surface-1); color: inherit; }
button { cursor: pointer; }
</style>
</head>
<body>
<h2 class="sr-only">Maquette d'un petit panneau overlay affiché en permanence dans un coin de l'écran pendant la création d'un lineup, avec statut de capture et rappel des raccourcis clavier.</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
<div style="background:var(--surface-0);border-radius:12px;padding:2rem;display:flex;">
  <div style="background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:10px;padding:10px 14px;width:220px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <div id="dot" style="width:8px;height:8px;border-radius:50%;background:var(--text-accent);animation:pulse 1.6s ease-in-out infinite;"></div>
      <span id="statusText" style="font-size:13px;font-weight:500;">Prêt à capturer</span>
    </div>
    <div style="font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;">
      <span>F9 — capturer</span>
      <span>F10 — tester</span>
    </div>
    <button onclick="simulateCapture()" style="width:100%;margin-top:10px;font-size:12px;">Simuler F9 (démo)</button>
  </div>
</div>
<script>
function simulateCapture(){
  const dot=document.getElementById('dot');
  const text=document.getElementById('statusText');
  text.textContent='Position capturée ✓';
  dot.style.background='var(--text-accent)';
  dot.style.animation='none';
  setTimeout(()=>{
    text.textContent='Prêt à capturer';
    dot.style.animation='pulse 1.6s ease-in-out infinite';
  },1800);
}
</script>
</body>
</html>
