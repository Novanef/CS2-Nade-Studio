<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sélecteur de spawn — instant smoke</title>
<style>
:root {
  --surface-0: #ffffff;
  --surface-1: #f7f7f5;
  --surface-2: #eeeeec;
  --border: rgba(0, 0, 0, 0.08);
  --border-accent: #93c5fd;
  --bg-accent: #eff6ff;
  --text-accent: #2563eb;
  --text-secondary: #6b7280;
  --radius: 8px;
}
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--surface-0);
  color: #111827;
  margin: 0;
  padding: 24px;
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  overflow: hidden;
}
button { font-family: inherit; font-size: 13px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 12px; background: var(--surface-1); cursor: pointer; }
button[disabled] { opacity: 0.5; cursor: not-allowed; }

.card-label { font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; }
.status-line { font-size: 13px; color: var(--text-secondary); margin: 5px 0; }

.radar-wrap {
  position: relative;
  width: 320px;
  aspect-ratio: 1 / 1;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-1);
  cursor: crosshair;
}
.radar-img { display: block; width: 100%; height: 100%; object-fit: cover; }

.instant-marker {
  position: absolute;
  box-sizing: border-box;
  width: 12px; height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--surface-0);
  border: 2px solid var(--text-accent);
  color: transparent;
  font-size: 0;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.instant-marker.done { background: var(--text-accent); }
.instant-marker.selected {
  z-index: 3;
  width: 24px; height: 24px;
  margin: -12px 0 0 -12px;
  background: var(--text-accent);
  color: var(--surface-0);
  font-size: 12px;
  box-shadow: 0 0 0 3px var(--bg-accent);
}

.actions-row { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<div>
  <p class="card-label">Spawn (instant smoke)</p>
  <div class="radar-wrap">
    <svg class="radar-img" viewBox="0 0 100 100"><rect width="100" height="100" fill="#3a3f33"/><circle cx="50" cy="55" r="28" fill="none" stroke="#8fae6a" stroke-width="1"/></svg>
    <button class="instant-marker done" style="left:38%;top:42%;"></button>
    <button class="instant-marker selected" style="left:52%;top:48%;">3</button>
    <button class="instant-marker" style="left:66%;top:58%;"></button>
    <button class="instant-marker" style="left:45%;top:65%;"></button>
  </div>
  <p class="status-line">Sélectionnez un spawn puis téléportez-vous.</p>
  <div class="actions-row">
    <button>Téléporter à ce spawn</button>
  </div>
</div>

</body>
</html>
