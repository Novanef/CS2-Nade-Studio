<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay en jeu</title>
<style>
:root {
  --surface-2: #eeeeec;
  --border-strong: rgba(0,0,0,0.25);
  --text-accent: #2563eb;
  --text-secondary: #6b7280;
  --text-error: #dc2626;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  background: var(--surface-2);
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.panel {
  border: 0.5px solid var(--border-strong);
  border-radius: 10px;
  padding: 10px 14px;
  box-sizing: border-box;
  width: 260px;
}
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-accent); animation: pulse 1.6s ease-in-out infinite; }
#statusText { font-size: 13px; font-weight: 500; }
.hotkeys { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="panel">
  <div class="row">
    <div id="dot"></div>
    <span id="statusText">Capture en cours…</span>
  </div>
  <div class="hotkeys">
    <span>F9 — capturer</span>
    <span>F6 — tester</span>
  </div>
</div>
</body>
</html>
