// Override chargé après gamemode_competitive.cfg — force sv_cheats à 1 pour ce serveur
// local de développement, puisque ce dernier réinitialise sv_cheats à 0.
sv_cheats 1

// prac.cfg tente de désactiver le warmup via "mp_do_warmup_period 0", mais cette
// commande n'existe plus sur ce build CS2 (erreur silencieuse "Unknown command" dans
// stdout.log) — le warmup reste donc actif, et repasser par une phase de warmup
// (constaté au réveil du serveur après hibernation, ex. à la reconnexion d'un joueur
// après une déconnexion) réexécute gamemode_competitive.cfg, qui écrase sv_cheats et
// tous les réglages de prac.cfg. mp_warmuptime/mp_warmup_pausetimer sont les convars
// valides sur ce build pour neutraliser le warmup.
mp_warmuptime 0
mp_warmup_pausetimer 0
// gamemode_competitive.cfg met aussi mp_warmuptime_all_players_connected à 120 —
// démarre un compte à rebours ("Match starting in X", la popup observée) dès qu'il
// détecte tous les joueurs attendus connectés, indépendamment de mp_warmuptime.
mp_warmuptime_all_players_connected 0

// Config de practice (armes/munitions/argent/prévisualisation de grenade), exécutée en
// dernier pour ne pas être écrasée par les réglages du gamemode compétitif.
exec prac.cfg
